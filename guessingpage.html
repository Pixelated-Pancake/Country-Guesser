<!DOCTYPE html>
<html lang="en">

    <head>

        <title>countryguesser</title>

        <link rel="stylesheet" href="guessingpage.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Basic&family=Chelsea+Market&display=swap" rel="stylesheet">

        <script src="guessingpage.js" defer></script>

    </head>

    <body>

        <header>

            <div class="header">
                <div class="emblogo">
                    <a href="https://embassy.hackclub.com/">
                        <img src="images/embassy-logo.png">
                    </a>
                </div>
                <div class="gitlink">
                    <a href="https://github.com/Pixelated-Pancake/Country-Guesser" class="gitlinkcontent">pancake/projects/countryguesser</a>
                </div>
            </div>

        </header>

        <div class="flagandoptions">

            <div class="flag">

                <img src="flags/China.png" id="flagimage" class="flagimage">

            </div>

            <div class="options">

                <button class="option1" id="option1">

                    China

                </button>

                <button class="option2" id="option2">

                    The USSR

                </button>
            </div>
        </div>

    </body>

</html>
